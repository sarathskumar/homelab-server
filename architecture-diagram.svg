<svg width="960" height="940" viewBox="0 0 960 940" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Homelab architecture diagram</title>
<desc>Home network connects to a Proxmox VE host on a Lenovo M75q Gen 2, containing internal NVMe and SATA storage, a live Jellyfin container, planned containers for Immich, Home Assistant, Nextcloud, a dashboard, and a reverse proxy, plus an external Exos X18 drive for bulk storage.</desc>
<rect x="0" y="0" width="960" height="940" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Home network -->
<rect x="380" y="20" width="200" height="70" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<g transform="translate(396,43)">
<path d="M2 14a16 16 0 0 1 20 0" stroke="#444441" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M6 18a10 10 0 0 1 12 0" stroke="#444441" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="12" cy="22" r="2" fill="#444441"/>
</g>
<text x="436" y="53" font-size="14" font-weight="500" fill="#2C2C2A">Home network</text>
<text x="436" y="73" font-size="12" fill="#5F5E5A">Ethernet (CAT6)</text>

<line x1="480" y1="90" x2="480" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Host container -->
<rect x="40" y="120" width="880" height="665" rx="20" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="60" y="150" font-size="14" font-weight="500" fill="#2C2C2A">Lenovo M75q Gen 2 &#183; Proxmox VE 9.2</text>

<!-- Storage section -->
<rect x="70" y="170" width="820" height="155" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="90" y="195" font-size="14" font-weight="500" fill="#0C447C">Internal storage</text>

<rect x="100" y="225" width="340" height="80" rx="10" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<g transform="translate(116,253)">
<rect x="0" y="0" width="24" height="16" rx="2" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<line x1="4" y1="4" x2="4" y2="12" stroke="#185FA5" stroke-width="1.5"/>
<line x1="9" y1="4" x2="9" y2="12" stroke="#185FA5" stroke-width="1.5"/>
<line x1="14" y1="4" x2="14" y2="12" stroke="#185FA5" stroke-width="1.5"/>
<line x1="19" y1="4" x2="19" y2="12" stroke="#185FA5" stroke-width="1.5"/>
</g>
<text x="156" y="259" font-size="14" font-weight="500" fill="#0C447C">Samsung 980 Pro 1TB NVMe</text>
<text x="156" y="279" font-size="12" fill="#185FA5">OS + container root disks</text>

<rect x="560" y="225" width="300" height="80" rx="10" fill="#ffffff" stroke="#185FA5" stroke-width="1"/>
<g transform="translate(576,253)">
<rect x="0" y="0" width="24" height="24" rx="4" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="12" cy="12" r="7" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="12" cy="12" r="2" fill="#185FA5"/>
</g>
<text x="616" y="259" font-size="14" font-weight="500" fill="#0C447C">WD Blue 1TB SATA</text>
<text x="616" y="279" font-size="12" fill="#185FA5">vzdump backup target</text>

<line x1="440" y1="265" x2="556" y2="265" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
<text x="498" y="250" font-size="12" fill="#185FA5" text-anchor="middle">nightly backup</text>

<!-- Live containers section -->
<rect x="70" y="345" width="820" height="145" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="90" y="370" font-size="14" font-weight="500" fill="#27500A">LXC containers &#8212; live</text>

<rect x="380" y="400" width="200" height="70" rx="10" fill="#ffffff" stroke="#3B6D11" stroke-width="1"/>
<g transform="translate(396,423)">
<circle cx="12" cy="12" r="12" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
<path d="M9 7 L18 12 L9 17 Z" fill="#3B6D11"/>
</g>
<text x="436" y="430" font-size="14" font-weight="500" fill="#27500A">Jellyfin</text>
<text x="436" y="450" font-size="12" fill="#3B6D11">Media server, VAAPI transcoding</text>

<!-- Planned containers section -->
<rect x="70" y="510" width="820" height="255" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="5 3"/>
<text x="90" y="535" font-size="14" font-weight="500" fill="#2C2C2A">LXC / Docker &#8212; planned</text>

<rect x="100" y="565" width="240" height="80" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<g transform="translate(116,593)">
<rect x="0" y="4" width="24" height="16" rx="3" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="8" y="0" width="8" height="5" rx="1" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<circle cx="12" cy="12" r="5" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
</g>
<text x="156" y="599" font-size="14" font-weight="500" fill="#444441">Immich</text>
<text x="156" y="619" font-size="12" fill="#5F5E5A">Photos &amp; videos</text>

<rect x="360" y="565" width="240" height="80" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<g transform="translate(376,593)">
<path d="M2 12 L12 3 L22 12 V22 H2 Z" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<text x="416" y="599" font-size="14" font-weight="500" fill="#444441">Home Assistant</text>
<text x="416" y="619" font-size="12" fill="#5F5E5A">Home automation</text>

<rect x="620" y="565" width="240" height="80" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<g transform="translate(636,593)">
<path d="M5 17a4 4 0 0 1 0 -8 5 5 0 0 1 9.8 -1 3.6 3.6 0 0 1 -0.8 9 Z" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
</g>
<text x="676" y="599" font-size="14" font-weight="500" fill="#444441">Nextcloud</text>
<text x="676" y="619" font-size="12" fill="#5F5E5A">File storage &amp; sync</text>

<rect x="100" y="665" width="370" height="80" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<g transform="translate(116,693)">
<rect x="0" y="2" width="24" height="16" rx="2" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="6" y1="22" x2="18" y2="22" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="12" y1="18" x2="12" y2="22" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="4" y="6" width="3" height="8" fill="#5F5E5A"/>
<rect x="9" y="9" width="3" height="5" fill="#5F5E5A"/>
<rect x="14" y="4" width="3" height="10" fill="#5F5E5A"/>
</g>
<text x="156" y="699" font-size="14" font-weight="500" fill="#444441">Homepage / Homarr</text>
<text x="156" y="719" font-size="12" fill="#5F5E5A">Unified dashboard</text>

<rect x="490" y="665" width="370" height="80" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<g transform="translate(506,693)">
<path d="M12 1 L21 5 V11 C21 17 17 21 12 23 C7 21 3 17 3 11 V5 Z" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
</g>
<text x="546" y="699" font-size="14" font-weight="500" fill="#444441">Reverse proxy</text>
<text x="546" y="719" font-size="12" fill="#5F5E5A">Cloudflare Tunnel, remote access</text>

<line x1="480" y1="785" x2="480" y2="813" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<!-- External storage -->
<rect x="380" y="815" width="200" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<g transform="translate(396,843)">
<ellipse cx="12" cy="4" rx="10" ry="3" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<path d="M2 4 V10 A10 3 0 0 0 22 10 V4" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<path d="M2 10 V16 A10 3 0 0 0 22 16 V10" fill="none" stroke="#185FA5" stroke-width="1.5"/>
</g>
<text x="436" y="849" font-size="14" font-weight="500" fill="#0C447C">Seagate Exos X18 18TB</text>
<text x="436" y="869" font-size="12" fill="#185FA5">External USB dock</text>
</svg>
